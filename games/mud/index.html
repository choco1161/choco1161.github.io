/* ---------- 상태 ---------- */
var S=null, RT={}, F=null, fightTimer=null, awaitName=false, awaitJob=false, medTok=0, lastSkKey='';
var hist=[], hpos=0;

function newState(name){return {name:name,job:null,lvl:1,exp:0,hp:80,mp:30,silver:30,room:'square',inv:{potion:3},equip:{weapon:'wood_sword',armor:'cloth',charm:null},bonusHp:0,bonusMp:0,kills:0,flags:{}};}
function J(){return (S&&JOBS[S.job])||NOJOB;}
function skills(){return SKILLSETS[S&&S.job]||SKILLSETS['검객'];}
function title(){return S.flags.zhizun?'무림지존':TITLES[S.lvl-1];}
function maxHp(){return Math.round((80+(S.lvl-1)*18+Math.max(0,S.lvl-10)*12)*J().hp)+S.bonusHp;}
function maxMp(){return Math.round((30+(S.lvl-1)*8+Math.max(0,S.lvl-10)*4)*J().mp)+S.bonusMp;}
function eq(slot){var id=S.equip[slot];return id?ITEMS[id]:null;}
function wAtk(w){return w?Math.round((w.atk||0)*(w.kind===J().kind?1.3:1)):0;}
function calcAtk(){var w=eq('weapon'),c=eq('charm');return Math.round((6+S.lvl*3+wAtk(w)+(c?c.atk||0:0))*J().atk);}
function calcDef(){var a=eq('armor'),c=eq('charm');return Math.round((S.lvl+(a?a.def||0:0)+(c?c.def||0:0))*J().def);}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&o.name&&o.lvl){var s=newState(o.name);for(var k in o)s[k]=o[k];if(!s.flags)s.flags={};return s;}}}catch(e){}
  return null;
}
function initRT(){
  RT={};
  Object.keys(ROOMS).forEach(function(id){
    var r=ROOMS[id];
    RT[id]={
      mobs:(r.spawns||[]).map(function(k){return {k:k,hp:MOBS[k].hp,dead:0};}),
      ground:(r.items||[]).map(function(it){return {id:it.id,n:it.n,resp:it.resp,once:it.once||null,cur:(it.once&&S.flags[it.once])?0:it.n,taken:0};})
    };
  });
}
function refresh(id){
  var rt=RT[id],now=Date.now();
  rt.mobs.forEach(function(m){if(m.hp<=0&&now-m.dead>=MOBS[m.k].resp*1000)m.hp=MOBS[m.k].hp;});
  rt.ground.forEach(function(g){if(g.cur<=0&&!(g.once&&S.flags[g.once])&&now-g.taken>=g.resp*1000)g.cur=g.n;});
}
function aliveMobs(){refresh(S.room);return RT[S.room].mobs.filter(function(m){return m.hp>0;});}

/* ---------- HUD ---------- */
function setBar(id,v,m,txt){
  var pct=m>0?Math.max(0,Math.min(100,v/m*100)):0;
  $('#'+id+'f').style.width=pct+'%';$('#'+id+'t').textContent=txt;
}
function buildSkills(){
  var box=$('#skills');
  box.innerHTML=S.job?skills().filter(function(s){return s.lv<=S.lvl;}).map(function(s){return '<button data-cmd="초식 '+s.id+'">'+s.name+'<small>내공'+s.mp+'</small></button>';}).join(''):'';
  lastSkKey=S.lvl+'|'+S.job;
}
function hud(){
  if(!S)return;
  var mh=maxHp(),mm=maxMp();
  $('#who').textContent=S.name+(S.job?' ['+S.job+']':'')+'  Lv.'+S.lvl+' '+title();
  $('#silver').textContent='은자 '+S.silver;
  setBar('hp',S.hp,mh,'기력 '+S.hp+'/'+mh);
  setBar('mp',S.mp,mm,'내공 '+S.mp+'/'+mm);
  if(S.lvl>=MAXLV)setBar('xp',1,1,'경험 MAX');else setBar('xp',S.exp,need(S.lvl),'경험 '+S.exp+'/'+need(S.lvl));
  var en=$('#enemy');
  if(F){var d=MOBS[F.inst.k];en.className='on';setBar('en',F.inst.hp,d.hp,d.name+' Lv.'+d.lvl+'  '+Math.max(0,F.inst.hp)+'/'+d.hp);}
  else en.className='';
  var ex=ROOMS[S.room].exits;
  document.querySelectorAll('#dirs button').forEach(function(b){b.className=ex[b.dataset.dir]?'':'off';});
  if(!awaitJob&&lastSkKey!==S.lvl+'|'+S.job)buildSkills();
}

/* ---------- 방 출력 ---------- */
function lvCls(l){return l>=S.lvl+3?'hard':(l>=S.lvl-1?'even':'easy');}
function hpDesc(m){var d=MOBS[m.k],r=m.hp/d.hp;return r>.75?'멀쩡함':r>.4?'부상':r>.15?'중상':'빈사';}
function printRoom(){
  var r=ROOMS[S.room];refresh(S.room);
  p('<span class="rn">【 '+r.name+' 】</span>'+(r.safe?' <span class="safe">안전지대</span>':''));
  p(r.desc,'desc');
  p('<span class="dim">출구</span> '+Object.keys(r.exits).map(function(d){return cmdLink(d+'('+ROOMS[r.exits[d]].name+')',d,'exit');}).join(' · '));
  var g=RT[S.room].ground.filter(function(x){return x.cur>0;});
  if(g.length)p('<span class="dim">바닥</span> '+g.map(function(x){return cmdLink(ITEMS[x.id].name+(x.cur>1?' ×'+x.cur:''),'줍기 '+ITEMS[x.id].name,'item');}).join(', '));
  var ms=aliveMobs();
  if(ms.length)p('<span class="dim">적</span> '+ms.map(function(m){var d=MOBS[m.k];return cmdLink(d.name,'공격 '+d.name,'mob')+' <span class="lv '+lvCls(d.lvl)+'">Lv.'+d.lvl+'</span> <span class="dim">('+hpDesc(m)+')</span>';}).join(' · '));
}
function danger(){
  var ms=aliveMobs();if(!ms.length)return;
  var mx=Math.max.apply(null,ms.map(function(m){return MOBS[m.k].lvl;}));
  if(mx>=S.lvl+3)p('⚠ 살기가 짙다. 아직 이곳은 그대에게 이른 듯하다…','warn');
}

/* ---------- 이동 ---------- */
function enter(to,quiet){
  cancelMed();S.room=to;refresh(to);
  if(!quiet)p('');
  printRoom();danger();hud();save();
}
function move(dir){
  if(F){p('교전 중에는 움직일 수 없다! '+cmdLink('도망','도망'),'warn');return;}
  var to=ROOMS[S.room].exits[dir];
  if(!to){p('그쪽으로는 길이 없다.','dim');return;}
  p('<span class="dim">'+dir+'쪽으로 걸음을 옮긴다…</span>');
  enter(to,true);
}

/* ---------- 전투 ---------- */
function startFight(inst){
  F={inst:inst};
  var d=MOBS[inst.k];
  p('<span class="warn">⚔ 그대는 '+eul(d.name)+' 향해 달려든다!</span>');
  if(fightTimer)clearInterval(fightTimer);
  fightTimer=setInterval(function(){if(F)combatAction(null);else{clearInterval(fightTimer);fightTimer=null;}},1800);
  cancelMed();hud();
}
function endFight(resetMob){
  if(F&&resetMob)F.inst.hp=MOBS[F.inst.k].hp;
  F=null;if(fightTimer){clearInterval(fightTimer);fightTimer=null;}
  hud();
}
function combatAction(skill){
  if(!F)return;
  var m=F.inst,d=MOBS[m.k];
  var mult=1;
  if(skill){S.mp-=skill.mp;mult=skill.mult*J().sk;}
  var crit=!skill&&Math.random()<J().crit;
  var raw=calcAtk()*mult*(0.85+Math.random()*0.3)*(crit?1.6:1);
  var dmg=Math.max(1,Math.round(raw-d.def));
  m.hp=Math.max(0,m.hp-dmg);
  if(skill)p('▶ <span class="mag">'+skill.msg+'</span> — '+eul(d.name)+' 가격해 <span class="dmg">'+dmg+'</span>의 피해!');
  else p('▶ '+(crit?'<b>급소를 노려</b> ':pick(HITS[J().kind]))+eul(d.name)+' 가격! <span class="dmg">'+dmg+'</span>의 피해'+(crit?'! 치명타!':'.'));
  if(m.hp<=0){killMob();return;}
  mobHit();
  hud();
}
function mobHit(){
  var m=F.inst,d=MOBS[m.k];
  if(Math.random()<J().dodge){p('◀ '+iga(d.name)+' 덤벼들었으나 몸을 틀어 피했다!','dim');return;}
  var heavy=d.boss&&Math.random()<0.2;
  var dmg=Math.max(1,Math.round(d.atk*(heavy?1.5:1)*(0.8+Math.random()*0.4)-calcDef()));
  S.hp-=dmg;
  p('◀ '+(heavy?'<span class="warn">✸ 필살!</span> ':'')+eun(d.name)+' '+pick(d.msgs)+'! <span class="hurt">-'+dmg+'</span>');
  if(S.hp<=0)die();
}
function killMob(){
  var m=F.inst,d=MOBS[m.k];
  m.hp=0;m.dead=Date.now();endFight(false);
  S.kills++;
  var sv=rnd(d.silver[0],d.silver[1]);S.silver+=sv;
  var xp=d.exp;
  p('<span class="good">☠ '+iga(d.name)+' 쓰러졌다! 경험 +'+xp+', 은자 +'+sv+'</span>');
  d.drops.forEach(function(dr){if(Math.random()<dr.c){var id=dr.jw!=null?JW[J().kind][dr.jw]:dr.id;addItem(id,1);p('   획득: '+cmdLink(ITEMS[id].name,'보기 '+ITEMS[id].name,'item')+(dr.jw!=null&&S.job?' <span class="dim">('+S.job+'의 병기로 모습을 바꾸었다)</span>':''),'good');}});
  if(NEWS[m.k]&&!S.flags['news_'+m.k]){S.flags['news_'+m.k]=true;news(NEWS[m.k]);}
  if(S.lvl<MAXLV){S.exp+=xp;levelCheck();}
  if(d.final&&!S.flags.ending){S.flags.ending=true;ending();}
  hud();save();
  if(d.ultimate){var first=!S.flags.zhizun;S.flags.zhizun=true;save();hud();zhizun(first);}
}
function levelCheck(){
  while(S.lvl<MAXLV&&S.exp>=need(S.lvl)){
    S.exp-=need(S.lvl);S.lvl++;
    S.hp=maxHp();S.mp=maxMp();
    p('<span class="good">✦ 경지가 올랐다! Lv.'+S.lvl+' ['+TITLES[S.lvl-1]+'] — 기력과 내공이 모두 차오른다.</span>');
    skills().forEach(function(s){if(s.lv===S.lvl)p('<span class="mag">✦ 새로운 초식을 깨우쳤다: '+s.name+' (내공 '+s.mp+')</span>');});
  }
  if(S.lvl>=MAXLV)S.exp=0;
}
function ending(){
  p('<div class="ending"><b style="font-size:18px">★ 제1부 완결 · 혈마 토벌 ★</b><br><br>마교의 마두 혈마가 쓰러졌다.<br>핏빛 안개가 걷히고, 석문 너머로 새벽빛이 스민다.<br><br>그러나 혈마는 숨이 끊어지기 전 웃으며 말했다.<br>"천산의 그분께서… 곧 강호를 덮으시리라…"<br><br><span class="dim">— 청운산 산길 서쪽 관도를 따라 낙양으로. 천마신교의 천마를 꺾고 무림지존에 오르라 —</span></div>');
}
function die(){
  endFight(true);
  var loss=Math.floor(S.silver*0.15);S.silver-=loss;
  var home=ROOMS[S.room].home||'inn';
  p('<span class="hurt">✖ 그대는 힘없이 쓰러졌다…</span>');
  p('<span class="dim">눈을 떠 보니 '+(home==='inn'?'청운객잔':ROOMS[home].name+' 객방')+'의 침상 위다. 지나가던 행인이 그대를 업어 온 모양이다. (은자 -'+loss+')</span>');
  S.hp=Math.ceil(maxHp()*0.4);S.mp=Math.ceil(maxMp()*0.3);
  enter(home);
}
var HITS={sword:['검을 휘둘러 ','매섭게 베어 ','날카롭게 찔러 ','정면으로 내리쳐 '],saber:['도를 크게 휘둘러 ','어깨째 내리찍어 ','비스듬히 베어 올려 ','묵직하게 후려쳐 '],fist:['정권을 꽂아 ','팔꿈치로 찍어 ','돌려차기로 ','장을 밀어 넣어 '],fan:['부채를 펼쳐 ','부챗살로 찔러 ','장풍을 실어 ','부채 끝으로 그어 ']};
function targetMob(arg){
  var list=aliveMobs();if(!list.length)return null;
  if(!arg)return list[0];
  if(/^\d+$/.test(arg))return list[parseInt(arg,10)-1]||null;
  for(var i=0;i<list.length;i++){if(MOBS[list[i].k].name.indexOf(arg)>=0)return list[i];}
  return null;
}
function attack(arg){
  if(F){p('이미 교전 중이다!','dim');return;}
  if(ROOMS[S.room].safe){p('이곳은 안전지대다. 싸울 상대가 없다.','dim');return;}
  var m=targetMob(arg);
  if(!m){p(arg?'그런 상대는 여기에 없다.':'공격할 상대가 없다.','dim');return;}
  startFight(m);combatAction(null);
}
function useSkill(spec,targetArg){
  if(!spec){skillList();return;}
  var sk=null;
  skills().forEach(function(s){if(String(s.id)===spec||s.name===spec||s.name.indexOf(spec)===0)sk=s;});
  if(!sk){p('그런 초식은 모른다. '+cmdLink('초식','초식'),'dim');return;}
  if(sk.lv>S.lvl){p('아직 그 초식을 익히지 못했다. (Lv.'+sk.lv+' 필요)','warn');return;}
  if(S.mp<sk.mp){p('내공이 부족하다! (필요 '+sk.mp+', 현재 '+S.mp+')','warn');return;}
  if(!F){
    if(ROOMS[S.room].safe){p('이곳은 안전지대다.','dim');return;}
    var m=targetMob(targetArg);
    if(!m){p('초식을 펼칠 상대가 없다.','dim');return;}
    startFight(m);
  }
  combatAction(sk);
}
function skillList(){
  var sk=skills();
  p('<b>【 '+(S.job||'')+' 초식 】</b>');
  p('<table class="t">'+sk.map(function(s){
    var ok=s.lv<=S.lvl;
    return '<tr><td>'+(ok?cmdLink(s.id+'. '+s.name,'초식 '+s.id,'cmd'):'<span class="dim">'+s.id+'. ???</span>')+'</td><td>'+(ok?'내공 '+s.mp+' · 위력 ×'+(Math.round(s.mult*J().sk*10)/10):'<span class="dim">Lv.'+s.lv+'에 습득</span>')+'</td></tr>';
  }).join('')+'</table>');
  p('<span class="dim">사용: 초식 1  /  '+sk[0].name+' 들개  (전투 중이면 현재 상대에게 사용)</span>');
}
function flee(){
  if(!F){p('도망칠 필요가 없다.','dim');return;}
  var d=MOBS[F.inst.k];
  if(Math.random()<(d.boss?0.4:0.65)){
    var ex=ROOMS[S.room].exits,keys=Object.keys(ex),to=ex[pick(keys)];
    p('<span class="warn">허둥지둥 몸을 빼 도망쳤다!</span>');
    endFight(true);enter(to,true);
  }else{
    p('<span class="warn">도망치려 했으나 길이 막혔다!</span>');
    mobHit();hud();
  }
}

/* ---------- 인벤토리 ---------- */
function addItem(id,n){S.inv[id]=(S.inv[id]||0)+(n||1);}
function delItem(id,n){S.inv[id]-=(n||1);if(S.inv[id]<=0)delete S.inv[id];}
function findInv(arg,filter){
  var ids=Object.keys(S.inv).filter(function(id){return S.inv[id]>0&&(!filter||filter(ITEMS[id]));});
  if(!arg)return ids[0]||null;
  for(var i=0;i<ids.length;i++){if(ITEMS[ids[i]].name.indexOf(arg)>=0)return ids[i];}
  return null;
}
function inventory(){
  var ids=Object.keys(S.inv).filter(function(i){return S.inv[i]>0;});
  p('<b>【 소지품 】</b> <span class="dim">은자 '+S.silver+'</span>');
  if(!ids.length){p('비어 있다.','dim');return;}
  p('<table class="t">'+ids.map(function(id){
    var it=ITEMS[id],act='';
    if(it.type==='use')act=cmdLink('사용','사용 '+it.name);
    else if(it.type==='weapon'||it.type==='armor'||it.type==='charm')act=cmdLink('착용','착용 '+it.name);
    return '<tr><td>'+cmdLink(it.name,'보기 '+it.name,'item')+' ×'+S.inv[id]+'</td><td>'+act+'</td></tr>';
  }).join('')+'</table>');
}
function equipment(){
  var lab={weapon:'무기',armor:'방어구',charm:'부적'};
  p('<b>【 장비 】</b> 공격력 '+calcAtk()+' · 방어력 '+calcDef());
  p('<table class="t">'+['weapon','armor','charm'].map(function(sl){
    var it=eq(sl);
    var tag=(sl==='weapon'&&it&&S.job)?(it.kind===J().kind?' <span class="good">숙련 ×1.3</span>':' <span class="dim">('+KN[it.kind]+' · 숙련 아님)</span>'):'';
    return '<tr><td class="dim">'+lab[sl]+'</td><td>'+(it?esc(it.name)+tag+' '+cmdLink('해제','해제 '+lab[sl]):'<span class="dim">없음</span>')+'</td></tr>';
  }).join('')+'</table>');
  if(S.job)p('<span class="dim">'+eun(S.job)+' '+KN[J().kind]+' 계열 무기를 들면 무기 공격력이 1.3배가 된다.</span>');
}
function wear(arg){
  var id=findInv(arg,function(it){return it.type==='weapon'||it.type==='armor'||it.type==='charm';});
  if(!id){p(arg?'그런 장비는 갖고 있지 않다.':'착용할 장비가 없다.','dim');return;}
  var it=ITEMS[id],slot=it.type;
  var old=S.equip[slot];
  delItem(id,1);if(old)addItem(old,1);
  S.equip[slot]=id;
  p('<span class="good">'+eul(it.name)+' 착용했다.</span> <span class="dim">(공격력 '+calcAtk()+' · 방어력 '+calcDef()+')</span>');
  save();hud();
}
function unwear(arg){
  var map={'무기':'weapon','방어구':'armor','갑옷':'armor','부적':'charm','weapon':'weapon','armor':'armor','charm':'charm'};
  var slot=map[arg];
  if(!slot){['weapon','armor','charm'].forEach(function(sl){var it=eq(sl);if(it&&arg&&it.name.indexOf(arg)>=0)slot=sl;});}
  if(!slot||!S.equip[slot]){p('해제할 장비를 지정하라. (예: 해제 무기)','dim');return;}
  var id=S.equip[slot];S.equip[slot]=null;addItem(id,1);
  p(eul(ITEMS[id].name)+' 벗었다.');save();hud();
}
function useItem(arg){
  var id=findInv(arg,function(it){return it.type==='use';});
  if(!id){p(arg?'그런 물건은 쓸 수 없다.':'사용할 물건이 없다.','dim');return;}
  var it=ITEMS[id],msg=[];
  if(it.hp){var h=Math.min(it.hp,maxHp()-S.hp);S.hp+=h;msg.push('기력 +'+h);}
  if(it.mp){var m=Math.min(it.mp,maxMp()-S.mp);S.mp+=m;msg.push('내공 +'+m);}
  if(it.permHp){S.bonusHp+=it.permHp;S.bonusMp+=it.permMp;S.hp+=it.permHp;S.mp+=it.permMp;msg.push('최대 기력 +'+it.permHp+', 최대 내공 +'+it.permMp+' (영구)');}
  delItem(id,1);
  p('<span class="good">'+eul(it.name)+' 사용했다. '+msg.join(', ')+'</span>');
  if(F){mobHit();}
  hud();save();
}
function pickup(arg){
  if(F){p('교전 중에는 주울 수 없다!','warn');return;}
  refresh(S.room);
  var g=RT[S.room].ground.filter(function(x){return x.cur>0&&(!arg||ITEMS[x.id].name.indexOf(arg)>=0);});
  if(!g.length){p('주울 것이 없다.','dim');return;}
  g.forEach(function(x){
    addItem(x.id,x.cur);
    p('<span class="good">'+eul(ITEMS[x.id].name)+(x.cur>1?' '+x.cur+'개 ':' ')+'주웠다.</span>');
    x.cur=0;x.taken=Date.now();
    if(x.once)S.flags[x.once]=true;
  });
  save();
}

/* ---------- 상점 ---------- */
function shop(){
  var r=ROOMS[S.room];
  if(!r.shop){p('이곳에는 상점이 없다. (객잔·대장간·낙양성에서 이용 가능)','dim');return;}
  p('<b>【 '+r.name+' 】</b> <span class="dim">은자 '+S.silver+'</span>');
  p('<table class="t">'+shopList(r.shop).map(function(id){var it=ITEMS[id],m=it.desc.match(/\(([^)]*)\)\s*$/);return '<tr><td>'+cmdLink(it.name,'구매 '+it.name,'item')+'</td><td>'+it.price+'은자</td><td class="dim">'+(m?esc(m[1]):esc(it.desc))+'</td></tr>';}).join('')+'</table>');
  if(r.shop!=='inn')p('<span class="dim">병기는 '+(S.job?S.job+'의 숙련 무기('+KN[J().kind]+')':'검')+' 위주로 들여놓았다.</span>');
  if(r.shop==='smith'||r.shop==='luoyang')p('<span class="dim">판매: 판매 &lt;물건&gt;  /  '+'</span>'+cmdLink('판매 잡템','판매 잡템')+'<span class="dim"> (전리품 일괄)</span>');
  else p('<span class="dim">판매: 판매 &lt;물건&gt;</span>');
}
function buy(arg){
  var r=ROOMS[S.room];if(!r.shop){p('이곳에서는 살 수 없다.','dim');return;}
  var parts=arg.split(/\s+/),qty=1;
  if(parts.length>1&&/^\d+$/.test(parts[parts.length-1])){qty=Math.min(99,parseInt(parts.pop(),10));}
  var name=parts.join(' ');
  var id=null;shopList(r.shop).forEach(function(i){if(name&&ITEMS[i].name.indexOf(name)>=0)id=i;});
  if(!id){p('그런 물건은 팔지 않는다. '+cmdLink('상점','상점'),'dim');return;}
  var cost=ITEMS[id].price*qty;
  if(S.silver<cost){p('은자가 부족하다. (필요 '+cost+', 보유 '+S.silver+')','warn');return;}
  S.silver-=cost;addItem(id,qty);
  p('<span class="good">'+eul(ITEMS[id].name)+(qty>1?' '+qty+'개 ':' ')+'샀다. (-'+cost+'은자)</span>');
  save();hud();
}
function sell(arg){
  var r=ROOMS[S.room];if(!r.shop){p('이곳에서는 팔 수 없다.','dim');return;}
  if(arg==='잡템'||arg==='전리품'){
    var tot=0,cnt=0;
    Object.keys(S.inv).forEach(function(id){if(ITEMS[id].type==='junk'){tot+=ITEMS[id].value*S.inv[id];cnt+=S.inv[id];delete S.inv[id];}});
    if(!cnt){p('팔 전리품이 없다.','dim');return;}
    S.silver+=tot;p('<span class="good">전리품 '+cnt+'개를 팔아 '+tot+'은자를 받았다.</span>');save();hud();return;
  }
  var id=findInv(arg);
  if(!id){p('그런 물건은 갖고 있지 않다.','dim');return;}
  var it=ITEMS[id];
  if(it.nosell){p('이건 팔 수 없다.','dim');return;}
  delItem(id,1);S.silver+=it.value;
  p('<span class="good">'+eul(it.name)+' 팔아 '+it.value+'은자를 받았다.</span>');save();hud();
}
function rest(){
  var c=ROOMS[S.room].rest;
  if(!c){p('객잔(청운객잔·낙양성)에서만 쉴 수 있다.','dim');return;}
  if(S.silver<c){p('은자가 부족하다. ('+c+'은자)','warn');return;}
  S.silver-=c;S.hp=maxHp();S.mp=maxMp();

var BADWORDS=/씨\s*발|시\s*발|ㅅ\s*ㅂ|ㅆ\s*ㅂ|병\s*신|ㅂ\s*ㅅ|개\s*새|좆|지\s*랄|썅|니\s*애미|느\s*금|fuck|shit/gi;

/* ---------- 명령 처리 ---------- */
function exec(line){
  line=line.trim();
  if(!line&&!awaitName)return;
  if(awaitName){
    var nm=line.replace(/[<>&"]/g,'').slice(0,8)||'무명';
    S=newState(nm);initRT();awaitName=false;
    $('#in').placeholder='명령 입력 (예: 북, 공격 들개, 도움)';
    p('<span class="good">'+esc(nm)+' 대협, 강호에 오신 것을 환영합니다.</span>');
    save();askJob();return;
  }
  if(awaitJob){
    var jn=line.replace(/^직업\s*/,''),pick2=null;
    if(/^[1-4]$/.test(jn))pick2=JOB_ORDER[+jn-1];
    JOB_ORDER.forEach(function(j){if(jn===j||(jn&&j.indexOf(jn)===0))pick2=j;});
    if(!pick2){p('검객 · 도객 · 권사 · 도사 중에서 골라 주십시오.','warn');return;}
    chooseJob(pick2);return;
  }
  if(confirmReset){confirmReset=false;if(line==='확인'||line==='예'||line.toLowerCase()==='y'){doReset();return;}p('초기화를 취소했다.','dim');return;}
  var parts=line.split(/\s+/),v=parts[0],arg=parts.slice(1).join(' ');
  var vl=v.toLowerCase();
  if(DIRNAMES[vl]){move(DIRNAMES[vl]);return;}
  switch(vl){
    case '이동':case '가':case 'go':if(DIRNAMES[arg.toLowerCase()])move(DIRNAMES[arg.toLowerCase()]);else p('어느 쪽으로? (북 남 동 서)','dim');return;
    case '보기':case '봐':case '살피기':case 'l':case 'look':if(arg)lookTarget(arg);else{printRoom();}hud();return;
    case '공격':case '때려':case '쳐':case 'a':case 'kill':case 'attack':attack(arg);return;
    case '초식':case '무공':case '기술':case 'skill':{var pp=arg.split(/\s+/);useSkill(pp[0]||'',pp.slice(1).join(' '));return;}
    case '도망':case '도주':case 'flee':flee();return;
    case '운기':case '운기조식':case '명상':meditate();return;
    case '휴식':case '쉬기':rest();return;
    case '소문':case '귀동냥':rumor();return;
    case '줍기':case '줍':case '획득':case 'get':pickup(arg);return;
    case '가방':case '소지품':case '인벤':case 'i':case 'inv':inventory();return;
    case '장비':case 'eq':equipment();return;
    case '착용':case '장착':case 'wear':wear(arg);return;
    case '해제':case '벗기':unwear(arg);return;
    case '사용':case '먹기':case '복용':case 'use':useItem(arg);return;
    case '상태':case '능력치':case 'st':case 'score':status();return;
    case '상점':case '목록':case 'list':shop();return;
    case '구매':case '사기':case 'buy':buy(arg);return;
    case '판매':case '팔기':case 'sell':sell(arg);return;
    case '지도':case 'map':worldMap();return;
    case '도움':case '도움말':case '?':case 'help':case 'h':help();return;
    case '외침':case '외쳐':case '/s':case 'shout':shout(arg);return;
    case '엔딩':if(S.flags.zhizun)zhizun(false);else p('아직 무림지존에 오르지 못했다. 천산의 천마를 꺾어라.','dim');return;
    case '직업':p('이미 '+S.job+'의 길을 걷고 있다. 직업은 바꿀 수 없다. ('+JOBS[S.job].perk+')','dim');return;
    case '초기화':case 'reset':confirmReset=true;p('<span class="warn">정말 처음부터 다시 시작할까요? 진행 상황이 모두 사라집니다. "확인"을 입력하세요.</span>');return;
  }
  var sk=null;skills().forEach(function(s){if(s.name===v)sk=s;});
  if(sk){useSkill(String(sk.id),arg);return;}
  p('알 수 없는 명령이다. '+cmdLink('도움','도움')+'을 참고하라.','dim');
}
var confirmReset=false;
function doReset(){
  try{localStorage.removeItem(KEY);}catch(e){}
  endFight(false);cancelMed();S=null;log.innerHTML='';start();
}
function run(cmd,echo){
  if(echo)p('<span class="echo">&gt; '+esc(cmd)+'</span>');
  try{exec(cmd);}catch(e){p('<span class="warn">오류가 발생했다: '+esc(e.message)+'</span>');}
  if(S)hud();
}

/* ---------- 시작 ---------- */
function start(){
  banner();
  var s=load();
  if(s){
    S=s;initRT();
    S.hp=Math.min(S.hp,maxHp());S.mp=Math.min(S.mp,maxMp());
    p('<span class="good">다시 오셨군요, '+esc(S.name)+' 대협. (Lv.'+S.lvl+' '+title()+')</span>');
    p('<span class="dim">진행 상황이 자동 저장되어 있습니다. 처음부터 하려면 "초기화".</span>');
    if(!S.job){
      p('<span class="mag">✦ 강호가 넓어졌다! 최고 레벨 20, 직업 4종, 직업별 무기와 초식, 낙양·북해 빙궁·천산 천마신교가 새로 열렸다.</span>');
      askJob();return;
    }
    p('');printRoom();hud();
  }else{
    awaitName=true;
    p('강호에 첫발을 내딛는 그대, <b>존함</b>을 알려 주십시오.','desc');
    p('<span class="dim">(8자 이내로 입력 후 엔터 — 비워 두면 "무명")</span>');
    $('#in').placeholder='이름을 입력하세요';
    $('#hpt').textContent='';$('#mpt').textContent='';$('#xpt').textContent='';
    $('#who').textContent='강호무림';$('#silver').textContent='';
  }
}

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-cmd]'):null;
  if(t){run(t.getAttribute('data-cmd'),true);}
});
$('#f').addEventListener('submit',function(e){
  e.preventDefault();
  var inp=$('#in'),v=inp.value;inp.value='';
  if(v.trim()){hist.push(v);hpos=hist.length;}
  if(awaitName){p('<span class="echo">&gt; '+esc(v.trim()||'(무명)')+'</span>');exec(v);}
  else run(v,true);
  if(window.matchMedia&&matchMedia('(pointer:fine)').matches)inp.focus();
});
$('#in').addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'&&hist.length){hpos=Math.max(0,hpos-1);this.value=hist[hpos]||'';e.preventDefault();}
  else if(e.key==='ArrowDown'&&hist.length){hpos=Math.min(hist.length,hpos+1);this.value=hist[hpos]||'';e.preventDefault();}
});
setInterval(function(){
  if(!S||F||awaitName)return;
  var mh=maxHp(),mm=maxMp();
  if(S.hp<mh||S.mp<mm){
    S.hp=Math.min(mh,S.hp+Math.max(1,Math.floor(mh*0.02)));
    S.mp=Math.min(mm,S.mp+Math.floor(mm*0.04)+1);
    hud();
  }
},5000);
setInterval(function(){if(S)save();},15000);

start();
})();
</script>

function hook(){return window.MUD_onShout;}

    });
