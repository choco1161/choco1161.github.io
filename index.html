<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>choco1161 작업실</title>
<meta name="description" content="choco1161이 만든 웹 도구와 페이지 모음">
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2dc; --accent: #7a4b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --card: #201f1d; --text: #f1efea; --muted: #a09d96;
            --line: #33312e; --accent: #d9a273; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  .list { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .list a {
    display: block; padding: 18px 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  .list a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .title { font-weight: 600; font-size: 1.05rem; }
  .desc { color: var(--muted); font-size: .95rem; }
  .date { color: var(--muted); font-size: .8rem; float: right; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>choco1161 작업실</h1>
  <p class="sub">직접 만든 웹 도구와 페이지를 모아두는 곳</p>

  <ul class="list" id="list"></ul>

  <footer>© choco1161</footer>
</main>

<script>
  // 새 작품을 만들면 여기에 한 줄씩 추가 (최신이 위로)
  const projects = [
    { path: "hello/", title: "첫 페이지", desc: "사이트가 잘 동작하는지 확인하는 예시 페이지", date: "2026-11-07" },
  ];

  const list = document.getElementById("list");
  for (const p of projects) {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${p.path}">
      <span class="date">${p.date}</span>
      <div class="title"></div><div class="desc"></div></a>`;
    li.querySelector(".title").textContent = p.title;
    li.querySelector(".desc").textContent = p.desc;
    list.appendChild(li);
  }
</script>
</body>
</html>
