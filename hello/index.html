<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 페이지</title>
<style>
  :root { --bg: #f7f6f3; --text: #1d1d1f; --accent: #7a4b2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161514; --text: #f1efea; --accent: #d9a273; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--text); font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  button { font: inherit; padding: 10px 20px; border-radius: 999px; border: 2px solid var(--accent);
           background: transparent; color: var(--accent); cursor: pointer; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div>
    <h1>안녕하세요 👋</h1>
    <p>이 페이지가 보이면 GitHub Pages가 잘 동작하는 거예요.</p>
    <p><button id="b">눌러보기</button> <span id="n">0</span></p>
    <p><a href="../">← 목록으로</a></p>
  </div>
  <script>
    let n = 0;
    document.getElementById("b").onclick = () => document.getElementById("n").textContent = ++n;
  </script>
</body>
</html>
