/* Layout: full-bleed 3D trading floor, HUD on top, collapsible input dock at the bottom.

:root{
  --bg:#121214;
  --panel:#1b1b1e;
  --panel-2:#252529;
  --line:#37373d;
  --fg:#f4f4f5;

  --gold:#e2b25a;

body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;

#app{position:relative;height:100%;width:100%;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}

#stage canvas{display:block;width:100%;height:100%}

.hud .sub{margin:2px 0 0;font-size:12px;color:var(--mute)}
.hud .rate{font-family:var(--font-num);font-size:13px;color:var(--fg);text-align:right}
.hud .rate small{display:block;font-family:var(--font-ui);font-size:11px;color:var(--mute)}
.hud .back{pointer-events:auto;display:inline-block;margin-bottom:4px;font-size:12px;color:var(--mute);text-decoration:none}
.hud .back:hover{color:var(--fg)}
.hud .rate-link{pointer-events:auto;text-decoration:none;text-align:right}
.hud .rate-link span{display:block;margin-top:2px;font-size:11px;color:var(--gold)}
.hud .rate-link:hover .rate{color:var(--gold)}
.live{color:var(--gold)}
.badge{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);font-size:11px;font-weight:500;color:var(--mute);vertical-align:2px;
  background:rgba(27,27,30,.8);
}

.dock{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  pointer-events:none;
  display:flex;justify-content:center;
}
.card{
  pointer-events:auto;width:100%;max-width:560px;min-width:0;
  background:rgba(27,27,30,.94);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;backdrop-filter:blur(6px);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-head h2{margin:0;font-size:14px;font-weight:700}
.card-head .tag{font-size:12px;color:var(--mute)}
.toggle{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);
  font:inherit;font-size:12px;border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;
}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

.del{appearance:none;border:0;background:transparent;color:var(--mute);font:inherit;font-size:11px;margin-left:6px;padding:2px 4px;cursor:pointer;text-decoration:underline}

</div>

  })();

  /* ---------- 평단 입력 ---------- */
  var KEY = 'nasdaq-floor-v1';
  function syncRateHud() {
    var r = getRate();
    $('hudRate').innerHTML = 'USD/KRW ' + fmt(r, 1) + '<small>' + (Math.abs(r - DEF_RATE) < 0.05 ? RATE_ASOF + ' 기준' : '직접 입력값') + '</small>';
    drawAll();
  }
  function roomText(n) {
    var lo = Math.floor(n / 10) * 10, hi = lo + 9;
    return '통합 방 · 내 층 ' + n + '층 (채팅 탭에서 대화)';
  }
  function showFloor(isExample) {
    var sym = $('sym').value, s = STOCKS[sym];
    var avg = parseFloat($('avg').value), rate = parseFloat($('rate').value);
    if (!(avg > 0) || !(rate > 0)) {
      $('result').textContent = '평단과 환율을 입력해주세요.';
      return;
    }
    var krw = avg * rate, n = Math.floor(krw / 10000);
    if (!isExample) { labelText = s.short + ' ' + n + '층'; drawLabel(); }
    $('result').innerHTML = '$' + fmt(avg) + ' × ' + fmt(rate, 1) + '원 = ' + Math.round(krw).toLocaleString('ko-KR') + '원 → <b>' + s.short + ' ' + n + '층</b>';
    if (n < 1) $('result').innerHTML += ' <span style="color:var(--mute)">(1만 원 미만이라 0층)</span>';
    $('room').textContent = isExample ? '' : roomText(n);
    if (!isExample) joinRoom(n);
    $('exampleTag').textContent = isExample ? '예시 값이에요' : '';
    syncRateHud();
    if (!isExample) {
      try { localStorage.setItem(KEY, JSON.stringify({ sym: sym, avg: avg, rate: rate })); } catch (e) {}
    }
  }
  $('show').addEventListener('click', function () { showFloor(false); });
  $('clear').addEventListener('click', function () {
    $('avg').value = '';
    labelText = '나'; drawLabel();
    $('result').textContent = '평단을 지웠어요. 다시 입력하면 이름 위에 층이 표시돼요.';
    $('room').textContent = '';
    joinRoom(null);
    $('exampleTag').textContent = '';
    try { localStorage.removeItem(KEY); } catch (e) {}
  });
  $('rate').addEventListener('input', syncRateHud);
  $('toggle').addEventListener('click', function () {
    var body = $('body'), open = body.hidden;
    body.hidden = !open;
    this.textContent = open ? '접기' : '펼치기';
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  /* ---------- 자동 갱신: 예약 작업이 db market/latest 에 쓴 종가를 받아 반영 ---------- */
  (async function () {
    try {
      if (!(window.claude && window.claude.use)) return;
      var mdb = await window.claude.use('db');
      if (!mdb) return;
      mdb.doc('market/latest').onSnapshot(function (snap) {
        if (!snap.exists) return;
        var v = snap.data() || {}, ch = false;
        var cl = v.closes || {};
        Object.keys(STOCKS).forEach(function (k) {
          var c = cl[k];
          if (!c || !(c.p > 0)) return;
          var S = STOCKS[k];
          S.p = c.p; if (c.prev > 0) S.prev = c.prev; if (c.asOf) S.asOf = String(c.asOf);
          if (Array.isArray(c.hist) && c.hist.length) S.hist = c.hist.filter(function (x) { return x > 0; }).slice(-5);
          ch = true;
        });
        if (v.fx && v.fx.rate > 0) {
          var old = DEF_RATE, cur = parseFloat($('rate').value);
          DEF_RATE = v.fx.rate; if (v.fx.asOf) RATE_ASOF = String(v.fx.asOf);
          if (!(cur > 0) || Math.abs(cur - old) < 0.05) $('rate').value = String(DEF_RATE);
          ch = true;
        }
        if (ch) { syncRateHud(); try { if (typeof showFloor === 'function' && $('avg').value) showFloor(!saved || !(saved.avg > 0)); } catch (e) {} }
      }, function () {});
    } catch (e) {}
  })();

  /* ---------- 자동 갱신 (사이트): GitHub Actions가 매일 쓰는 market.json ---------- */
  function applyMarket(v) {
    var cl = v.closes || {}, ch = false;
    Object.keys(STOCKS).forEach(function (k) {
      var c = cl[k];
      if (!c || !(c.p > 0)) return;
      var S = STOCKS[k];
      S.p = c.p; if (c.prev > 0) S.prev = c.prev; if (c.asOf) S.asOf = String(c.asOf);
      if (Array.isArray(c.hist) && c.hist.length > 1) S.hist = c.hist.filter(function (x) { return x > 0; }).slice(-5);
      ch = true;
    });
    if (v.fx && v.fx.rate > 0) {
      var old = DEF_RATE, cur = parseFloat($('rate').value);
      DEF_RATE = v.fx.rate; if (v.fx.asOf) RATE_ASOF = String(v.fx.asOf);
      $('rate').placeholder = String(DEF_RATE);
      if (!(cur > 0) || Math.abs(cur - old) < 0.05) $('rate').value = String(DEF_RATE);
      ch = true;
    }
    if (v.updated) {
      var d = new Date(v.updated);
      if (!isNaN(d)) $('hudUpd').textContent = ' · 갱신 ' + d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    if (ch) { syncRateHud(); if ($('avg').value) showFloor(!saved || !(saved.avg > 0)); }
  }
  fetch('../../data/stocks/market.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (v) { if (v) applyMarket(v); })
    .catch(function () {});

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved && saved.avg > 0) {
    $('sym').value = saved.sym; $('avg').value = saved.avg; $('rate').value = saved.rate;
    showFloor(false);
  } else {
    $('sym').value = 'NVDA'; $('avg').value = '180'; $('rate').value = String(DEF_RATE);
    showFloor(true);
  }

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('700 40px "Noto Sans KR"'),
      document.fonts.load('400 40px "Noto Sans KR"'),
      document.fonts.load('500 40px "DM Mono"')
    ]).then(function () { drawAll(); drawLabel(); }).catch(function () {});
  }
})();
</script>
